[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hangdoi-google-ads-mcp"
version = "0.1.0"
description = "Hang Doi Google Ads MCP control plane"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.0,<5",
  "google-auth>=2.40,<3",
  "requests>=2.32,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.setuptools]
py-modules = ["app", "audit_log", "collector", "google_ads", "performance_store", "policy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
